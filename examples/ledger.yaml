openapi: 3.1.0
info:
  title: Ledger API
  version: 1.0.0
  description: A small banking API used to demo specmock. Accounts, their transactions, and payments between accounts.
paths:
  /accounts:
    get:
      operationId: listAccounts
      summary: List accounts
      parameters:
        - { name: status, in: query, schema: { $ref: '#/components/schemas/AccountStatus' } }
        - { name: currency, in: query, schema: { type: string } }
      responses:
        '200':
          description: Accounts
          content:
            application/json:
              schema:
                type: object
                required: [items, total]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Account' } }
                  total: { type: integer }
    post:
      operationId: openAccount
      summary: Open an account
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NewAccount' }
      responses:
        '201':
          description: Opened
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Account' }
        '400': { description: Invalid request }
  /accounts/{accountId}:
    parameters:
      - { name: accountId, in: path, required: true, schema: { type: string } }
    get:
      operationId: getAccount
      summary: Get one account
      responses:
        '200':
          description: The account
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Account' }
        '404': { description: Not found }
    patch:
      operationId: updateAccount
      summary: Change status or nickname
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                status: { $ref: '#/components/schemas/AccountStatus' }
                nickname: { type: string, maxLength: 40 }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Account' }
    delete:
      operationId: closeAccount
      summary: Close an account
      responses:
        '204': { description: Closed }
  /accounts/{accountId}/transactions:
    parameters:
      - { name: accountId, in: path, required: true, schema: { type: string } }
    get:
      operationId: listTransactions
      summary: Transactions of an account, newest first
      responses:
        '200':
          description: Transactions
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Transaction' }
  /payments:
    post:
      operationId: createPayment
      summary: Pay from one account to another
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PaymentRequest' }
      responses:
        '201':
          description: Accepted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Payment' }
        '400': { description: Invalid request }
        '422': { description: Rejected (e.g. insufficient funds) }
    get:
      operationId: listPayments
      summary: List payments
      responses:
        '200':
          description: Payments
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Payment' }
  /payments/{paymentId}:
    parameters:
      - { name: paymentId, in: path, required: true, schema: { type: string } }
    get:
      operationId: getPayment
      summary: Get one payment
      responses:
        '200':
          description: The payment
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Payment' }
        '404': { description: Not found }
components:
  schemas:
    AccountStatus:
      type: string
      enum: [ACTIVE, FROZEN, CLOSED]
    NewAccount:
      type: object
      required: [owner, currency]
      additionalProperties: false
      properties:
        owner: { type: string, minLength: 2 }
        currency: { type: string, enum: [EUR, CHF, USD] }
        nickname: { type: string, maxLength: 40 }
    Account:
      type: object
      required: [id, owner, iban, currency, balance, status, openedAt]
      properties:
        id: { type: string, format: uuid }
        owner: { type: string }
        iban: { type: string }
        currency: { type: string, enum: [EUR, CHF, USD] }
        balance: { type: number, minimum: 0, maximum: 25000 }
        status: { $ref: '#/components/schemas/AccountStatus' }
        nickname: { type: string }
        openedAt: { type: string, format: date-time }
    Transaction:
      type: object
      required: [id, accountId, amount, currency, bookedAt, description]
      properties:
        id: { type: string, format: uuid }
        accountId: { type: string }
        amount: { type: number, minimum: -2000, maximum: 2000 }
        currency: { type: string, enum: [EUR, CHF, USD] }
        bookedAt: { type: string, format: date-time }
        description: { type: string }
    PaymentRequest:
      type: object
      required: [fromAccountId, toAccountId, amount, currency]
      additionalProperties: false
      properties:
        fromAccountId: { type: string }
        toAccountId: { type: string }
        amount: { type: number, exclusiveMinimum: 0 }
        currency: { type: string, enum: [EUR, CHF, USD] }
        reference: { type: string, maxLength: 140 }
    Payment:
      type: object
      required: [id, fromAccountId, toAccountId, amount, currency, status, createdAt]
      properties:
        id: { type: string, format: uuid }
        fromAccountId: { type: string }
        toAccountId: { type: string }
        amount: { type: number }
        currency: { type: string, enum: [EUR, CHF, USD] }
        reference: { type: string }
        status: { type: string, enum: [PENDING, COMPLETED, REJECTED] }
        createdAt: { type: string, format: date-time }
